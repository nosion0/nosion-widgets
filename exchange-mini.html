<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>환율 미니</title>
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --background: hsl(0 0% 100%);
      --foreground: hsl(220 10% 55%);
      --card: hsl(0 0% 100%);
      --border: hsl(220 9% 84%);
      --muted: hsl(210 20% 96%);
      --muted-foreground: hsl(215 14% 50%);
      --radius: 0.75rem;
      --transition: 0.2s ease;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont,
                   system-ui, 'Segoe UI', sans-serif;
      background: var(--background);
      color: var(--foreground);
      margin: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      word-break: keep-all;
    }

    body {
      padding: 1rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .widget-wrapper {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      position: relative;
      width: fit-content;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.125rem 1.375rem 1rem;
      width: 210px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 0.625rem;
      overflow: hidden;
      box-shadow: none;
      cursor: grab;
    }

    .card.dragging { cursor: grabbing; }

    /* === Header === */
    .header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .flag {
      display: flex;
      align-items: center;
      user-select: none;
      flex-shrink: 0;
    }

    .flag svg {
      width: 21px;
      height: 14px;
      display: block;
    }

    .country {
      font-size: 0.8125rem;
      color: var(--foreground);
      flex: 1;
    }

    .unit-label {
      font-size: 0.6875rem;
      color: var(--muted-foreground);
      opacity: 0.7;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    /* === Value === */
    .value {
      font-size: 1.875rem;
      font-weight: 400;
      color: hsl(220 10% 42%);
      letter-spacing: -0.03em;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .value .won {
      font-size: 0.9375rem;
      color: var(--muted-foreground);
      margin-left: 0.125rem;
      letter-spacing: 0;
    }

    /* === Footer === */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.6875rem;
      color: var(--muted-foreground);
      opacity: 0.6;
      font-variant-numeric: tabular-nums;
      min-height: 1em;
    }

    /* === Resize handles === */
    .resize-handle {
      position: absolute;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .handle-top, .handle-bottom { left: 0; right: 0; height: 12px; cursor: ns-resize; }
    .handle-top { top: 0; }
    .handle-bottom { bottom: 0; }
    .handle-left, .handle-right { top: 0; bottom: 0; width: 12px; cursor: ew-resize; }
    .handle-left { left: 0; }
    .handle-right { right: 0; }

    .resize-handle .bar {
      border-radius: 99px;
      background: var(--border);
      opacity: 0;
      transition: opacity var(--transition);
    }
    .handle-top .bar, .handle-bottom .bar { width: 32px; height: 3px; }
    .handle-left .bar, .handle-right .bar { width: 3px; height: 32px; }
    .resize-handle:hover .bar { opacity: 1; }

    /* === Controls === */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      opacity: 0.25;
      transition: opacity var(--transition);
    }
    .widget-wrapper:hover .controls { opacity: 1; }

    .control-btn {
      width: 28px;
      height: 28px;
      border-radius: 0.4rem;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted-foreground);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: background var(--transition), color var(--transition);
      position: relative;
    }
    .control-btn:hover { background: var(--muted); color: var(--foreground); }
    .control-btn svg { width: 13px; height: 13px; stroke-width: 1.75; }

    .control-btn[data-tooltip]::after {
      content: attr(data-tooltip);
      position: absolute;
      right: calc(100% + 8px);
      top: 50%;
      transform: translateY(-50%);
      background: hsl(220 10% 30%);
      color: #fff;
      font-size: 0.6875rem;
      padding: 0.25rem 0.5rem;
      border-radius: 0.35rem;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    .control-btn[data-tooltip]:hover::after { opacity: 1; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .control-btn.loading svg { animation: spin 0.8s linear infinite; }
  </style>
</head>
<body>
  <div class="widget-wrapper" id="widget">
    <div class="card" id="card">

      <div class="header">
        <span class="flag" id="flag"></span>
        <span class="country" id="country">—</span>
        <span class="unit-label" id="unitLabel"></span>
      </div>

      <div class="value" id="value">—</div>

      <div class="footer">
        <span id="diff"></span>
        <span id="updatedTime"></span>
      </div>

      <div class="resize-handle handle-top" data-direction="top"><div class="bar"></div></div>
      <div class="resize-handle handle-bottom" data-direction="bottom"><div class="bar"></div></div>
      <div class="resize-handle handle-left" data-direction="left"><div class="bar"></div></div>
      <div class="resize-handle handle-right" data-direction="right"><div class="bar"></div></div>
    </div>

    <div class="controls">
      <button class="control-btn" id="resizeResetBtn" type="button"
              data-tooltip="크기 초기화" title="크기 초기화" aria-label="카드 크기 초기화">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 3 21 3 21 9"/>
          <polyline points="9 21 3 21 3 15"/>
          <line x1="21" y1="3" x2="14" y2="10"/>
          <line x1="3" y1="21" x2="10" y2="14"/>
        </svg>
      </button>
      <button class="control-btn" id="refreshBtn" type="button"
              data-tooltip="환율 새로고침" title="환율 새로고침" aria-label="환율 새로고침">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    /* ===== 통화 정의 (URL ?c=JPY 로 선택) ===== */
    const CURRENCIES = {
      JPY: { country: '일본',     unit: 100 },
      VND: { country: '베트남',   unit: 100 },
      USD: { country: '미국',     unit: 1 },
      THB: { country: '태국',     unit: 1 },
      TWD: { country: '대만',     unit: 1 },
      PHP: { country: '필리핀',   unit: 1 },
      CNY: { country: '중국',     unit: 1 },
      EUR: { country: '유럽',     unit: 1 },
      HKD: { country: '홍콩',     unit: 1 },
      SGD: { country: '싱가포르', unit: 1 },
    };

    const param = (new URLSearchParams(location.search).get('c') || 'JPY').toUpperCase();
    const CODE  = CURRENCIES[param] ? param : 'JPY';
    const { country, unit } = CURRENCIES[CODE];

    /* ===== localStorage keys (통화별 분리) ===== */
    const KEY_SIZE = `nosion-exchange-mini-${CODE}-size-v1`;
    const KEY_POS  = `nosion-exchange-mini-${CODE}-pos-v1`;
    const KEY_HIST = 'nosion-exchange-mini-hist-v1';

    /* ===== 컬러 국기 SVG (30x20) ===== */
    const FB = 'hsl(220 9% 84%)';

    function flagSvg(code, inner) {
      return `<svg viewBox="0 0 30 20" aria-hidden="true">
        <defs><clipPath id="f${code}"><rect width="30" height="20" rx="2.5"/></clipPath></defs>
        <g clip-path="url(#f${code})"><rect width="30" height="20" fill="#fff"/>${inner}</g>
        <rect x="0.5" y="0.5" width="29" height="19" rx="2.2" fill="none" stroke="${FB}"/>
      </svg>`;
    }

    const FLAGS = {
      JPY: `<circle cx="15" cy="10" r="5.5" fill="#BC002D"/>`,
      VND: `<rect width="30" height="20" fill="#DA251D"/>
            <polygon fill="#FFDE00" points="15,4.5 16.29,8.22 20.23,8.3 17.09,10.68 18.23,14.45 15,12.2 11.77,14.45 12.91,10.68 9.77,8.3 13.71,8.22"/>`,
      USD: `<rect width="30" height="2.86" fill="#B22234"/>
            <rect y="5.71" width="30" height="2.86" fill="#B22234"/>
            <rect y="11.43" width="30" height="2.86" fill="#B22234"/>
            <rect y="17.14" width="30" height="2.86" fill="#B22234"/>
            <rect width="13" height="8.57" fill="#3C3B6E"/>`,
      THB: `<rect width="30" height="3.33" fill="#A51931"/>
            <rect y="6.67" width="30" height="6.67" fill="#2D2A4A"/>
            <rect y="16.67" width="30" height="3.33" fill="#A51931"/>`,
      TWD: `<rect width="30" height="20" fill="#FE0000"/>
            <rect width="15" height="10" fill="#000095"/>
            <circle cx="7.5" cy="5" r="2.6" fill="#fff"/>`,
      PHP: `<rect width="30" height="10" fill="#0038A8"/>
            <rect y="10" width="30" height="10" fill="#CE1126"/>
            <polygon fill="#fff" points="0,0 13,10 0,20"/>
            <circle cx="4.2" cy="10" r="1.8" fill="#FCD116"/>`,
      CNY: `<rect width="30" height="20" fill="#DE2910"/>
            <polygon fill="#FFDE00" points="8,3 8.94,5.71 11.8,5.76 9.52,7.49 10.35,10.24 8,8.6 5.65,10.24 6.48,7.49 4.2,5.76 7.06,5.71"/>
            <circle cx="14" cy="3.2" r="0.9" fill="#FFDE00"/>
            <circle cx="16" cy="6" r="0.9" fill="#FFDE00"/>
            <circle cx="16" cy="9.3" r="0.9" fill="#FFDE00"/>
            <circle cx="14" cy="12" r="0.9" fill="#FFDE00"/>`,
      EUR: `<rect width="30" height="20" fill="#003399"/>
            <g fill="#FFCC00">
              <circle cx="21" cy="10" r="0.9"/><circle cx="20.2" cy="13" r="0.9"/>
              <circle cx="18" cy="15.2" r="0.9"/><circle cx="15" cy="16" r="0.9"/>
              <circle cx="12" cy="15.2" r="0.9"/><circle cx="9.8" cy="13" r="0.9"/>
              <circle cx="9" cy="10" r="0.9"/><circle cx="9.8" cy="7" r="0.9"/>
              <circle cx="12" cy="4.8" r="0.9"/><circle cx="15" cy="4" r="0.9"/>
              <circle cx="18" cy="4.8" r="0.9"/><circle cx="20.2" cy="7" r="0.9"/>
            </g>`,
      HKD: `<rect width="30" height="20" fill="#DE2910"/>
            <g fill="#fff">
              <ellipse cx="15" cy="6.8" rx="1.6" ry="3.4"/>
              <ellipse cx="15" cy="6.8" rx="1.6" ry="3.4" transform="rotate(72 15 10)"/>
              <ellipse cx="15" cy="6.8" rx="1.6" ry="3.4" transform="rotate(144 15 10)"/>
              <ellipse cx="15" cy="6.8" rx="1.6" ry="3.4" transform="rotate(216 15 10)"/>
              <ellipse cx="15" cy="6.8" rx="1.6" ry="3.4" transform="rotate(288 15 10)"/>
            </g>`,
      SGD: `<rect width="30" height="10" fill="#ED2939"/>
            <circle cx="6.8" cy="5" r="3" fill="#fff"/>
            <circle cx="8" cy="5" r="2.6" fill="#ED2939"/>
            <g fill="#fff">
              <circle cx="12" cy="2.8" r="0.55"/><circle cx="14" cy="4.3" r="0.55"/>
              <circle cx="13.2" cy="6.7" r="0.55"/><circle cx="10.8" cy="6.7" r="0.55"/>
              <circle cx="10" cy="4.3" r="0.55"/>
            </g>`,
    };

    /* ===== 초기 정적 표시 ===== */
    document.title = `${country} 환율`;
    document.getElementById('flag').innerHTML = flagSvg(CODE, FLAGS[CODE]);
    document.getElementById('country').textContent = country;
    document.getElementById('unitLabel').textContent = unit === 1 ? CODE : `${CODE} ${unit}`;

    /* ===== Fetch rates (primary + fallback, 무료·키 불필요) ===== */
    async function fetchRates() {
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/KRW');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (data.result !== 'success' || !data.rates) throw new Error('bad payload');
        return data.rates;
      } catch (e) { /* fall through */ }

      const res = await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/krw.json');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!data.krw) throw new Error('bad payload');
      const rates = {};
      Object.entries(data.krw).forEach(([k, v]) => { rates[k.toUpperCase()] = v; });
      return rates;
    }

    /* ===== Value formatting ===== */
    function fmtValue(v) {
      if (v >= 1000) return Math.round(v).toLocaleString('ko-KR');
      if (v >= 100)  return v.toFixed(1);
      return v.toFixed(2);
    }

    function fmtDiff(d) {
      const a = Math.abs(d);
      const s = a >= 100 ? Math.round(a).toLocaleString('ko-KR')
              : a >= 10  ? a.toFixed(1)
              : a.toFixed(2);
      return (d > 0 ? '▲' : '▼') + s;
    }

    /* ===== History (전일 대비 비교용, 통화별 병합 저장) ===== */
    function loadHist() {
      try { return JSON.parse(localStorage.getItem(KEY_HIST) || '{}'); }
      catch (e) { return {}; }
    }

    function saveHist(hist) {
      const dates = Object.keys(hist).sort();
      while (dates.length > 10) delete hist[dates.shift()];
      try { localStorage.setItem(KEY_HIST, JSON.stringify(hist)); } catch (e) {}
    }

    /* ===== Render ===== */
    function render(rates) {
      const per = rates[CODE];
      if (!per) { renderError(); return; }
      const krw = unit / per;

      const today = new Date().toISOString().slice(0, 10);
      const hist = loadHist();
      const prevDate = Object.keys(hist).filter(d => d < today).sort().pop();
      const prev = prevDate ? hist[prevDate] : null;

      document.getElementById('value').innerHTML =
        `${fmtValue(krw)}<span class="won">원</span>`;

      let diffText = '';
      if (prev && prev[CODE]) {
        const d = krw - prev[CODE];
        if (Math.abs(d) >= 0.005) diffText = fmtDiff(d);
      }
      document.getElementById('diff').textContent = diffText;

      hist[today] = Object.assign({}, hist[today], { [CODE]: krw });
      saveHist(hist);

      const now = new Date();
      document.getElementById('updatedTime').textContent =
        now.toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' }) + ' ' +
        now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    }

    function renderError() {
      document.getElementById('value').innerHTML = '<span style="font-size:0.8125rem;font-weight:400;">불러올 수 없습니다</span>';
      document.getElementById('diff').textContent = '';
      document.getElementById('updatedTime').textContent = '';
    }

    async function refresh() {
      const btn = document.getElementById('refreshBtn');
      btn.classList.add('loading');
      try {
        render(await fetchRates());
      } catch (e) {
        renderError();
      } finally {
        btn.classList.remove('loading');
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', refresh);

    /* ===== Resize reset ===== */
    document.getElementById('resizeResetBtn').addEventListener('click', () => {
      const card = document.getElementById('card');
      card.style.width  = '210px';
      card.style.height = '';
      try { localStorage.removeItem(KEY_SIZE); } catch (e) {}
    });

    /* ===== Drag to move ===== */
    (function initDrag() {
      const wrapper = document.getElementById('widget');
      const card    = document.getElementById('card');
      const BLOCKED = '.control-btn,.resize-handle,button,[contenteditable],a,input';
      let dragging = false, startX = 0, startY = 0, origLeft = 0, origTop = 0;

      card.addEventListener('mousedown', e => {
        if (e.target.closest(BLOCKED)) return;
        dragging = true;
        const rect = wrapper.getBoundingClientRect();
        origLeft = rect.left;
        origTop  = rect.top;
        startX   = e.clientX;
        startY   = e.clientY;
        card.classList.add('dragging');
        e.preventDefault();
      });

      document.addEventListener('mousemove', e => {
        if (!dragging) return;
        wrapper.style.position = 'fixed';
        wrapper.style.left = `${origLeft + e.clientX - startX}px`;
        wrapper.style.top  = `${origTop  + e.clientY - startY}px`;
      });

      document.addEventListener('mouseup', () => {
        if (!dragging) return;
        dragging = false;
        card.classList.remove('dragging');
        try {
          localStorage.setItem(KEY_POS, JSON.stringify({ left: wrapper.style.left, top: wrapper.style.top }));
        } catch (e) {}
      });

      try {
        const pos = JSON.parse(localStorage.getItem(KEY_POS) || 'null');
        if (pos) { wrapper.style.position = 'fixed'; wrapper.style.left = pos.left; wrapper.style.top = pos.top; }
      } catch (e) {}
    })();

    /* ===== Resize handles ===== */
    (function initResize() {
      const wrapper = document.getElementById('widget');
      const card = document.getElementById('card');
      const MIN_W = 160, MAX_W = 400, MIN_H = 90;
      let resizing = false, dir = '', startW = 0, startH = 0, startX = 0, startY = 0, startLeft = 0, startTop = 0;

      document.querySelectorAll('.resize-handle').forEach(h => {
        h.addEventListener('mousedown', e => {
          resizing = true;
          dir    = h.dataset.direction;
          startW = card.offsetWidth;
          startH = card.offsetHeight;
          startX = e.clientX;
          startY = e.clientY;
          if (getComputedStyle(wrapper).position !== 'fixed') {
            const wrapperRect = wrapper.getBoundingClientRect();
            wrapper.style.position = 'fixed';
            wrapper.style.left = wrapperRect.left + 'px';
            wrapper.style.top = wrapperRect.top + 'px';
            wrapper.style.transform = 'none';
          }
          startLeft = parseFloat(wrapper.style.left) || 0;
          startTop = parseFloat(wrapper.style.top) || 0;
          e.preventDefault();
          e.stopPropagation();
        });
      });

      document.addEventListener('mousemove', e => {
        if (!resizing) return;
        const dx = e.clientX - startX, dy = e.clientY - startY;
        if (dir === 'right' || dir === 'left') {
          const delta = dir === 'right' ? dx : -dx;
          const newW = Math.min(MAX_W, Math.max(MIN_W, startW + 2 * delta));
          const actualDelta = newW - startW;
          card.style.width = newW + 'px';
          if (wrapper.style.position === 'fixed') {
            wrapper.style.left = (startLeft - actualDelta / 2) + 'px';
          }
        }
        if (dir === 'bottom' || dir === 'top') {
          const delta = dir === 'bottom' ? dy : -dy;
          const newH = Math.max(MIN_H, startH + 2 * delta);
          const actualDelta = newH - startH;
          card.style.height = newH + 'px';
          if (wrapper.style.position === 'fixed') {
            wrapper.style.top = (startTop - actualDelta / 2) + 'px';
          }
        }
      });

      document.addEventListener('mouseup', () => {
        if (!resizing) return;
        resizing = false;
        try {
          localStorage.setItem(KEY_SIZE, JSON.stringify({ w: card.offsetWidth, h: card.offsetHeight }));
          if (wrapper.style.position === 'fixed') {
            localStorage.setItem(KEY_POS, JSON.stringify({ left: wrapper.style.left, top: wrapper.style.top }));
          }
        } catch (e) {}
      });

      try {
        const s = JSON.parse(localStorage.getItem(KEY_SIZE) || 'null');
        if (s) { if (s.w) card.style.width = `${s.w}px`; if (s.h) card.style.height = `${s.h}px`; }
      } catch (e) {}
    })();

    /* ===== Init ===== */
    refresh();
    setInterval(refresh, 30 * 60 * 1000);   // 30분마다 자동 갱신
  </script>
</body>
</html>
