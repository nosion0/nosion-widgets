<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>참고 환율</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root{color-scheme:light dark;--background:hsl(0 0% 100%);--foreground:hsl(220 10% 55%);--card:hsl(0 0% 100%);--border:hsl(220 9% 84%);--muted:hsl(210 20% 96%);--muted-foreground:hsl(215 14% 50%);--radius:.75rem;--transition:.2s ease}
    *{box-sizing:border-box}html,body{margin:0;background:var(--background);color:var(--foreground);font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;word-break:keep-all}
    body{padding:12px;display:grid;place-items:center;min-height:100vh}
    /* Travel input card exception: responsive width and visible actions prevent saved
       drag/resize positions and hover-only controls escaping a narrow Notion iframe. */
    .widget-wrapper{width:min(100%,360px);min-width:0}.card{width:100%;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:none;overflow-wrap:anywhere}
    header{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:1.125rem;font-weight:500}#unitLabel{margin-left:auto;font-size:.6875rem;letter-spacing:.02em;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
    .quote{display:flex;align-items:baseline;gap:5px;margin:14px 0 7px}#value{min-width:0;font-size:clamp(22px,7vw,30px);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.04em;line-height:1.2}.won{font-size:.875rem;color:var(--muted-foreground)}
    #status{font-size:.8125rem;line-height:1.5;min-height:20px;margin-bottom:12px}#status[data-state="warning"],#status[data-state="error"]{font-weight:500;color:var(--muted-foreground);border-left:2px solid var(--border);padding-left:8px}
    .meta{font-size:.6875rem;color:var(--muted-foreground);line-height:1.7;border-top:1px solid var(--border);padding-top:10px;font-variant-numeric:tabular-nums}.meta p{margin:2px 0}a{color:inherit;text-underline-offset:2px}
    .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button{font:inherit;font-size:.8125rem;line-height:1.3;padding:8px 10px;background:var(--card);color:var(--foreground);border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:background var(--transition)}button:hover:not(:disabled){background:var(--muted)}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible{outline:2px solid var(--muted-foreground);outline-offset:3px}
    .note{font-size:.6875rem;line-height:1.6;color:var(--muted-foreground);margin:12px 0 0}
    @media(prefers-color-scheme:dark){:root{--background:hsl(0 0% 10%);--foreground:hsl(220 5% 80%);--card:hsl(0 0% 10%);--border:hsl(220 5% 30%);--muted:hsl(220 5% 16%);--muted-foreground:hsl(220 5% 68%)}}
  </style>
</head>
<body>
  <div class="widget-wrapper" id="widget">
  <main class="card" id="card" aria-label="참고 환율">
    <header><span id="country">환율</span><span id="unitLabel"></span></header>
    <div class="quote"><strong id="value">—</strong><span class="won">원</span></div>
    <div id="status" role="status" aria-live="polite">불러오는 중…</div>
    <div class="meta">
      <p id="asOf">환율 기준: —</p>
      <p id="fetchedAt">조회: —</p>
      <p>출처: <a id="source" href="https://www.exchangerate-api.com" target="_blank" rel="noopener noreferrer">Rates By Exchange Rate API</a></p>
    </div>
    <div class="actions"><button id="copyBtn" type="button" disabled>환율 숫자 복사</button><button id="refreshBtn" type="button">다시 조회</button></div>
    <p class="note">일별 참고 환율이며 수수료가 제외되어 있습니다. Notion 환율 속성에 직접 입력하세요. 실제 결제액은 카드 청구서나 환전 내역을 확인하세요.</p>
  </main>
  </div>
  <script>
    'use strict';
    const CURRENCIES={JPY:{country:'일본',unit:100},VND:{country:'베트남',unit:100},USD:{country:'미국 달러',unit:1},THB:{country:'태국',unit:1},TWD:{country:'대만',unit:1},PHP:{country:'필리핀',unit:1},CNY:{country:'중국',unit:1},EUR:{country:'유로',unit:1},HKD:{country:'홍콩',unit:1},SGD:{country:'싱가포르',unit:1}};
    const raw=new URLSearchParams(location.search).get('c');
    const requested=(raw===null?'JPY':raw).trim().toUpperCase();
    const CODE=Object.hasOwn(CURRENCIES,requested)?requested:null;
    const {country,unit}=CODE?CURRENCIES[CODE]:{country:'지원하지 않는 통화',unit:1};
    const PRIMARY='https://open.er-api.com/v6/latest/KRW';
    const FALLBACK='https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/krw.json';
    let lastQuote=null;
    let refreshing=false;
    const el=id=>document.getElementById(id);
    document.title=CODE?`${country} 참고 환율`:'통화 확인 필요';
    el('country').textContent=country;
    el('unitLabel').textContent=CODE?`${unit} ${CODE} 기준`:'';

    async function fetchJSON(url){
      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),8000);
      try{
        const response=await fetch(url,{signal:controller.signal,cache:'no-store'});
        if(!response.ok)throw new Error(`HTTP ${response.status}`);
        return await response.json();
      }finally{clearTimeout(timer);}
    }
    function validRate(value){return typeof value==='number'&&Number.isFinite(value)&&value>0;}
    function makeQuote(per,asOf,provider,sourceURL,isFallback){
      if(!validRate(per))throw new Error('선택 통화의 환율이 유효하지 않습니다.');
      const krw=unit/per;
      if(!validRate(krw))throw new Error('환산 결과가 유효하지 않습니다.');
      return {krw,asOf,provider,sourceURL,isFallback,fetchedAt:new Date().toISOString()};
    }
    async function fetchRates(){
      if(!CODE)throw new Error('지원하지 않는 통화');
      try{
        const data=await fetchJSON(PRIMARY);
        if(data.result!=='success'||data.base_code!=='KRW'||!data.rates)throw new Error('응답 기준 확인 필요');
        const timestamp=data.time_last_update_unix;
        if(typeof timestamp!=='number'||!Number.isFinite(timestamp)||timestamp<=0)throw new Error('기준 시각 확인 필요');
        const asOf=new Date(timestamp*1000).toISOString();
        return makeQuote(data.rates[CODE],asOf,'Rates By Exchange Rate API','https://www.exchangerate-api.com',false);
      }catch(error){
        const data=await fetchJSON(FALLBACK);
        if(!data.krw||typeof data.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(data.date))throw new Error('대체 자료 기준 확인 필요');
        const parsed=new Date(data.date+'T00:00:00Z');
        if(!Number.isFinite(parsed.getTime())||parsed.toISOString().slice(0,10)!==data.date)throw new Error('대체 자료 날짜 오류');
        return makeQuote(data.krw[CODE.toLowerCase()],data.date,'대체 · Fawaz Ahmed Currency API','https://github.com/fawazahmed0/exchange-api',true);
      }
    }
    function fmtValue(value){return value.toLocaleString('ko-KR',{minimumFractionDigits:0,maximumFractionDigits:6});}
    function timeKST(iso){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(new Date(iso))+' KST';}
    function setStatus(message,state='normal'){el('status').textContent=message;el('status').dataset.state=state;}
    function render(quote){
      lastQuote=quote;
      el('value').textContent=fmtValue(quote.krw);
      el('asOf').textContent='환율 기준: '+(quote.isFallback?quote.asOf+' · 제공처 기준일':timeKST(quote.asOf));
      el('fetchedAt').textContent='조회: '+timeKST(quote.fetchedAt);
      el('source').textContent=quote.provider;
      el('source').href=quote.sourceURL;
      el('copyBtn').disabled=false;
      el('copyBtn').textContent='환율 숫자 복사';
      const basis=Date.parse(quote.asOf.length===10?quote.asOf+'T00:00:00Z':quote.asOf);
      const old=Date.now()-basis>72*60*60*1000;
      setStatus(old?'기준일이 3일 이상 지난 참고값입니다.':quote.isFallback?'기본 조회 실패 · 대체 공급원 참고값':'일별 참고 환율',old||quote.isFallback?'warning':'normal');
    }
    async function refresh(){
      if(refreshing)return;
      if(!CODE){setStatus('지원하지 않는 통화입니다. URL의 c 값을 확인하세요.','error');return;}
      refreshing=true;
      el('refreshBtn').disabled=true;
      setStatus(lastQuote?'다시 조회 중 · 마지막 성공값 표시':'불러오는 중…');
      try{render(await fetchRates());}
      catch(error){
        if(lastQuote){setStatus('갱신 실패 · 마지막 성공값입니다. 기준일을 확인하세요.','warning');}
        else{el('value').textContent='—';el('copyBtn').disabled=true;setStatus('환율을 불러올 수 없습니다. 잠시 후 다시 조회하세요.','error');}
      }finally{refreshing=false;el('refreshBtn').disabled=false;}
    }
    el('refreshBtn').addEventListener('click',refresh);
    el('copyBtn').addEventListener('click',async()=>{
      if(!lastQuote)return;
      const number=fmtValue(lastQuote.krw).replaceAll(',','');
      try{await navigator.clipboard.writeText(number);el('copyBtn').textContent='복사됨 · Notion에 입력';}
      catch(error){el('copyBtn').textContent='복사 불가 · 직접 입력';}
    });
    refresh();
    setInterval(refresh,60*60*1000);
  </script>
</body>
</html>
